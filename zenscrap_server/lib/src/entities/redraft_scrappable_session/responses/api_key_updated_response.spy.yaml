# ApiKeyUpdatedResponse
#
# This response is sent when the user successfully adds or updates their
# personal OpenAI API key during a chat session.
#
# This response is used to:
# 1. Notify the user that their API key was successfully configured
# 2. Signal to the frontend that the CreditLimitReachedResponse has been resolved
# 3. Enable the chat input to continue messaging
#
# The frontend uses the presence of this response in the chat history to determine
# if a previous CreditLimitReachedResponse has been resolved. If this response
# exists after a CreditLimitReachedResponse, the "Add API Key" button should
# be disabled and the user can continue chatting.
class: ApiKeyUpdatedResponse
extends: ChatResponse
fields:
    messageText: String
