class: ScrappableTestResult
table: scrappable_test_result
fields:
    testExtractRule: String
    extractJsonResult: String
    scrappableId: int
    referenceTestDataId: int?
    referenceTestData: ReferenceTestData?, relation(name=test_result_reference, field=referenceTestDataId, onDelete=cascade)
indexes:
    scrappable_id_idx:
        fields: scrappableId
    reference_test_data_unique_idx:
        fields: referenceTestDataId
        unique: true