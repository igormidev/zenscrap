class: Scrappable
table: scrappable
fields:
  id: int?, defaultPersist=serial
  accountId: int?, relation(name=account_info_scrappable, parent=account_info)
  apiUsageOwnerNanoId: String?, scope=serverOnly
  createdAt: DateTime
  generalInfosUpdatedAt: DateTime
  extractRulesUpdatedAt: DateTime
  name: String
  description: String
  testEndpointAvailableUntil: DateTime?
  scrappingBeeExtractRules: ScrappingBeeExtractLogic?, relation(name=scrappable_scrapping_bee_extract_logic)
  willHideFromMarketplace: bool
  targetRequestId: int
  targetRequest: ScrappableRequest?, relation(name=request_scrappable, field=targetRequestId)
  referenceTestDataId: int
  referenceTestData: ReferenceTestData?, relation(name=test_scrappable, field=referenceTestDataId)
  scrappableAnalytics: List<ScrappableAnalytics>?, relation(name=scrappable_analytics)
  category: ScraperCategory
  isDeleted: bool
  ### Auto-Fix Configuration ###
  # Whether auto-fix is enabled for this scrappable (user can toggle)
  autoFixEnabled: bool, default=true
  # Number of consecutive errors required before triggering auto-fix (configurable by user)
  consecutiveErrorThreshold: int, default=100
  # Current count of consecutive errors (denormalized for query efficiency)
  # Reset to 0 on success, incremented on error
  currentConsecutiveErrors: int, default=0
  # Timestamp of last auto-fix attempt (for cooldown period - 1 hour minimum between attempts)
  lastAutoFixAttemptAt: DateTime?
  # Flag to prevent concurrent auto-fix attempts on the same scrappable
  autoFixInProgress: bool, default=false
  # Number of failed auto-fix attempts (for exponential backoff)
  # Reset to 0 on successful fix, incremented on each failed attempt
  # After 5 failed attempts, auto-fix is disabled until manual reset
  autoFixAttemptCount: int, default=0
indexes:
  scrappable_target_request_unique_idx:
    fields: targetRequestId
    unique: true
  scrappable_reference_test_data_unique_idx:
    fields: referenceTestDataId
    unique: true
  # Index for efficient auto-fix candidate queries
  scrappable_auto_fix_candidates_idx:
    fields: autoFixEnabled, autoFixInProgress, currentConsecutiveErrors