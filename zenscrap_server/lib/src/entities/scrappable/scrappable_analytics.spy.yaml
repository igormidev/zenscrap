class: ScrappableAnalytics
table: scrappable_analytics
fields:
  requestStatus: RequestStatus
  requestedAt: DateTime
  attachedNanoId: String
  attachedApiKey: String
  scrappable: Scrappable?, relation(name=scrappable_analytics)
  details: AnalyticsRequestDetails?, relation(optional)
  apiKey: AccountApiKey?, relation(optional)
  duration: Duration?

indexes:
  scrappable_analytics_scrappable_id_idx:
    fields: scrappableId
  scrappable_analytics_attached_nanoid_idx:
    fields: attachedNanoId
  scrappable_analytics_attached_apikey_idx:
    fields: attachedApiKey
  scrappable_analytics_scrappable_requested_status_idx:
    fields: scrappableId, requestedAt, requestStatus