class: ScrappableRequest
table: scrappable_target_request
fields:
  url: String # Dynamic path fields are saved as {PATH_PARAM_NAME}. Example: www.mySocialMedia.com/posts/{postId}/comments/{commentsId}
  queryParams: Map<String, String?> # Query parameters that will be added to the URL. The map value is the default value if not in user payload. Example: {"sort": "asc", "filter": null}
  queryParamsNotRelatedToUrl: Map<String, String?> # Dynamic parameters used ONLY in extract_rules/js_scenario placeholders, NOT added to URL. For client-side interactions like search boxes, pagination buttons, filters. Example: {"searchQuery": null, "currentPage": null}
  pathParams: List<String> # The name of the paths params that will be requested by the user in his payload, Example: [postId, commentsId]
  scrappable: Scrappable?, relation(name=request_scrappable)