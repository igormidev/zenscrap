class: AccountInfo
table: account_info
fields:
  scrappables: List<Scrappable>?, relation(name=account_info_scrappable)
  authUser: module:auth_core:AuthUser?, relation
  accountApiUsageId: int
  accountApiUsage: AccountApiUsage?, relation(name=user_account_api_usage, field=accountApiUsageId)
  planTier: PlanTier
  stripeCustomerId: String?
  stripeSubscriptionId: String?
  subscriptionStatus: String?
  subscriptionEndDate: DateTime?
  accountAIUsageId: int
  accountAIUsage: AccountAIUsage?, relation(name=user_account_ai_usage, field=accountAIUsageId)
indexes:
  auth_user_id_unique_idx:
    fields: authUserId
    unique: true
  account_api_usage_id_unique_idx:
    fields: accountApiUsageId
    unique: true
  user_account_ai_usage_id_unique_idx:
    fields: accountAIUsageId
    unique: true