# Stripe Configuration Template
# Copy this file to passwords.yaml and fill in your actual Stripe credentials
# DO NOT commit passwords.yaml to version control

development:
  # Stripe API Keys
  stripeSecretKey: 'sk_test_YOUR_TEST_SECRET_KEY_HERE'
  stripeWebhookSecret: 'whsec_YOUR_WEBHOOK_SECRET_HERE'
  
  # Stripe Price IDs for Basic Plan
  stripeBasicPriceIdMonthly: 'price_YOUR_BASIC_MONTHLY_PRICE_ID'
  stripeBasicPriceIdYearly: 'price_YOUR_BASIC_YEARLY_PRICE_ID'
  
  # Stripe Price IDs for Pro Plan
  stripeProPriceIdMonthly: 'price_YOUR_PRO_MONTHLY_PRICE_ID'
  stripeProPriceIdYearly: 'price_YOUR_PRO_YEARLY_PRICE_ID'
  
  # Stripe Price IDs for Ultra Plan
  stripeUltraPriceIdMonthly: 'price_YOUR_ULTRA_MONTHLY_PRICE_ID'
  stripeUltraPriceIdYearly: 'price_YOUR_ULTRA_YEARLY_PRICE_ID'
  
  # Redirect URLs after payment
  stripeSuccessUrl: 'http://localhost:3000/success'
  stripeCancelUrl: 'http://localhost:3000/cancel'
  stripePortalReturnUrl: 'http://localhost:3000/account'

production:
  # Stripe API Keys (Production)
  stripeSecretKey: 'sk_live_YOUR_LIVE_SECRET_KEY_HERE'
  stripeWebhookSecret: 'whsec_YOUR_PRODUCTION_WEBHOOK_SECRET_HERE'
  
  # Stripe Price IDs for Basic Plan (Production)
  stripeBasicPriceIdMonthly: 'price_YOUR_BASIC_MONTHLY_PRICE_ID'
  stripeBasicPriceIdYearly: 'price_YOUR_BASIC_YEARLY_PRICE_ID'
  
  # Stripe Price IDs for Pro Plan (Production)
  stripeProPriceIdMonthly: 'price_YOUR_PRO_MONTHLY_PRICE_ID'
  stripeProPriceIdYearly: 'price_YOUR_PRO_YEARLY_PRICE_ID'
  
  # Stripe Price IDs for Ultra Plan (Production)
  stripeUltraPriceIdMonthly: 'price_YOUR_ULTRA_MONTHLY_PRICE_ID'
  stripeUltraPriceIdYearly: 'price_YOUR_ULTRA_YEARLY_PRICE_ID'
  
  # Redirect URLs after payment (Production)
  stripeSuccessUrl: 'https://yourdomain.com/success'
  stripeCancelUrl: 'https://yourdomain.com/cancel'
  stripePortalReturnUrl: 'https://yourdomain.com/account'

# Setup Instructions:
# 1. Create products and prices in Stripe Dashboard
# 2. Get your API keys from https://dashboard.stripe.com/apikeys
# 3. Set up webhook endpoint at https://yourdomain.com/stripe/webhook
# 4. Get webhook secret from webhook endpoint settings
# 5. Replace all placeholder values above with your actual values
# 6. Save as passwords.yaml (not passwords_stripe_template.yaml)