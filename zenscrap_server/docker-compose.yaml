services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: zenscrap
      POSTGRES_PASSWORD: "Jg86waNc-5JHZ0V7BQfhX8dEcV686fWQ"
    volumes:
      - zenscrap_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "2Vviag1SvYKZbHLZTwxIVOnhS3qPZPc3"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: zenscrap_test
      POSTGRES_PASSWORD: "JhYLJRsyClvAh-e6aPUfLhUwcC1pce4Y"
    volumes:
      - zenscrap_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "7gngo1LnHGeUs1m3JoputsyQtJjeZ9T8"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  zenscrap_data:
  zenscrap_test_data:
