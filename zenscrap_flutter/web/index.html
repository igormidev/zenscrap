    /* ==============================================
       ZenScrap Material 3 Splash Screen
       Beautiful, performant loading experience
       ============================================== */

    :root {
      /* Material 3 Blue-grey color palette */
      --md-primary: #607D8B;
      --md-primary-light: #8EACBB;
      --md-primary-dark: #34515E;
      --md-surface-light: #FAFCFD;
      --md-surface-dark: #1A2327;
      --md-on-surface-light: #607D8B;
      --md-on-surface-dark: #B0BEC5;

      /* Animation timing */
      --transition-duration: 0.5s;
      --pulse-duration: 2.5s;
      --spinner-duration: 1.4s;
    }

    html {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--md-primary);
      background: linear-gradient(145deg, var(--md-primary) 0%, var(--md-primary-dark) 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      overflow: hidden;
    }

    /* ============================================
       Splash Container - Main wrapper
       ============================================ */
    #splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity var(--transition-duration) ease-out;
    }

    #splash-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ============================================
       Logo Section - Centered with animation
       ============================================ */
    .splash-logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: logoFadeIn 0.8s ease-out forwards;
    }

    @keyframes logoFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .splash-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      animation: logoPulse var(--pulse-duration) ease-in-out infinite;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.15));
    }

    @keyframes logoPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.15));
      }
      50% {
        transform: scale(1.03);
        filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.2));
      }
    }

    /* ============================================
       Brand Text - App name below logo
       ============================================ */
    .splash-brand {
      margin-top: 24px;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      animation: brandFadeIn 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    @keyframes brandFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================
       Material 3 Circular Progress Indicator
       Pure CSS, no JS dependencies
       ============================================ */
    .spinner-container {
      margin-top: 48px;
      animation: spinnerFadeIn 0.6s ease-out 0.4s forwards;
      opacity: 0;
    }

    @keyframes spinnerFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .md-spinner {
      width: 44px;
      height: 44px;
      animation: spinnerRotate var(--spinner-duration) linear infinite;
    }

    @keyframes spinnerRotate {
      100% {
        transform: rotate(360deg);
      }
    }

    .md-spinner circle {
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-dasharray: 1, 200;
      stroke-dashoffset: 0;
      animation: spinnerDash var(--spinner-duration) ease-in-out infinite;
    }

    @keyframes spinnerDash {
      0% {
        stroke-dasharray: 1, 200;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -35;
      }
      100% {
        stroke-dasharray: 89, 200;
        stroke-dashoffset: -124;
      }
    }

    /* ============================================
       Loading Text - Subtle status indicator
       ============================================ */
    .loading-text {
      margin-top: 20px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.7);
      animation: loadingTextPulse 2s ease-in-out infinite, spinnerFadeIn 0.6s ease-out 0.6s forwards;
      opacity: 0;
    }

    @keyframes loadingTextPulse {
      0%, 100% {
        opacity: 0.7;
      }
      50% {
        opacity: 0.4;
      }
    }

    /* ============================================
       Dark Mode Support
       ============================================ */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: var(--md-surface-dark);
        background: linear-gradient(145deg, #263238 0%, #1A2327 100%);
      }

      .splash-brand {
        color: rgba(255, 255, 255, 0.9);
      }

      .md-spinner circle {
        stroke: var(--md-primary-light);
      }

      .loading-text {
        color: rgba(255, 255, 255, 0.6);
      }

      .splash-logo {
        filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.4));
      }

      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.4));
        }
        50% {
          transform: scale(1.03);
          filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.5));
        }
      }
    }

    /* ============================================
       Responsive adjustments
       ============================================ */
    @media (max-width: 480px) {
      .splash-logo {
        width: 100px;
        height: 100px;
      }

      .splash-brand {
        font-size: 22px;
        letter-spacing: 3px;
      }

      .md-spinner {
        width: 36px;
        height: 36px;
      }

      .spinner-container {
        margin-top: 36px;
      }
    }

    /* ============================================
       Reduced motion support (accessibility)
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
      .splash-logo,
      .splash-brand,
      .spinner-container,
      .loading-text,
      .splash-logo-wrapper {
        animation: none;
        opacity: 1;
      }

      .md-spinner {
        animation: spinnerRotate 2s linear infinite;
      }

      .md-spinner circle {
        animation: none;
        stroke-dasharray: 60, 200;
        stroke-dashoffset: -20;
      }

      #splash-container {
        transition: none;
      }
    }

    /* Legacy classes for compatibility */
    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /**

     * Called when Flutter's first frame is rendered.
     */
    function removeSplashFromWeb() {
      // Prevent multiple calls
      if (window._splashRemoved) return;
      window._splashRemoved = true;

      const splashContainer = document.getElementById("splash-container");

      if (splashContainer) {
        // Add fade-out class to trigger CSS transition
        splashContainer.classList.add("fade-out");

        // Remove elements after transition completes
        setTimeout(function() {
          splashContainer.remove();
          // Clean up legacy elements if they exist
          document.getElementById("splash")?.remove();
          document.getElementById("splash-branding")?.remove();
          // Remove splash styles to free memory
          document.getElementById("splash-screen-style")?.remove();
          // Reset body background for Flutter
          document.body.style.background = "transparent";
        }, 500); // Match CSS transition duration
      } else {
        // Fallback for legacy structure
        document.getElementById("splash")?.remove();
        document.getElementById("splash-branding")?.remove();
        document.body.style.background = "transparent";
      }
    }

    /**
     * Listen for Flutter's first frame event (works for dart2js builds).
     * See: https://github.com/flutter/flutter/issues/66066
     */
    window.addEventListener('flutter-first-frame', removeSplashFromWeb);

    /**
     * For WASM/Skwasm builds, the flutter-first-frame event may not fire.
     * Use polling to detect when Flutter's view element is fully ready.
     * This is a reliable cross-renderer approach.
     */
    function startFlutterDetection() {
      function checkFlutterReady() {
        // Check if Flutter's view element exists and has content
        var flutterView = document.querySelector('flutter-view');
        var glassPane = document.querySelector('flt-glass-pane');

        if (flutterView && glassPane && !window._splashRemoved) {
          // Give Flutter a brief moment to render the first frame
          setTimeout(function() {
            if (!window._splashRemoved) {
              removeSplashFromWeb();
            }
          }, 150);
          return true; // Stop polling
        }
        return false;
      }

      // Check immediately in case Flutter already loaded
      if (!checkFlutterReady()) {
        // Poll every 100ms until Flutter is ready or timeout
        var pollInterval = setInterval(function() {
          if (checkFlutterReady() || window._splashRemoved) {
            clearInterval(pollInterval);
          }
        }, 100);

        // Stop polling after 20 seconds
        setTimeout(function() {
          clearInterval(pollInterval);
        }, 20000);
      }

      // Ultimate fallback timeout in case all other methods fail
      setTimeout(function() {
        if (!window._splashRemoved) {
          console.warn('Flutter detection did not trigger within 15s. Removing splash as fallback.');
          removeSplashFromWeb();
        }
      }, 15000);
    }

    // Start detection after DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startFlutterDetection);
    } else {
      // DOM already loaded, start immediately
      startFlutterDetection();
    }
